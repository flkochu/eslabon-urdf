// ════════════════════════════════════════════════════════════════════
//  05 · hoja de despiece: plano de una pieza (vistas, cotas y agujeros)
// ════════════════════════════════════════════════════════════════════

// ── Agujeros y cilindros ───────────────────────────────────────────
// Bordes circulares cerrados (los mismos del snap) agrupados por eje y radio: dos bordes
// coaxiales del mismo diámetro son las bocas de un agujero o las tapas de un cilindro.
function canonAxis(v) {
  const k = Math.abs(v.x) >= Math.abs(v.y) && Math.abs(v.x) >= Math.abs(v.z) ? 'x' : Math.abs(v.y) >= Math.abs(v.z) ? 'y' : 'z';
  return v[k] < 0 ? v.clone().negate() : v.clone();
}
const axisName = (v) => (Math.abs(v.x) > 0.999 ? 'X' : Math.abs(v.y) > 0.999 ? 'Y' : Math.abs(v.z) > 0.999 ? 'Z' : '—');

function partRay(p) {
  const e = pool.get(p.id);
  if (BVH && !e.geo.boundsTree) { try { e.geo.computeBoundsTree(); } catch (err) { /* sin BVH */ } }
  const mesh = new THREE.Mesh(e.geo, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
  mesh.updateMatrixWorld(true);
  const rc = new THREE.Raycaster();
  rc.firstHitOnly = true;
  const ray = (origin, dir, near = 0) => { rc.set(origin, dir); rc.near = near; rc.far = Infinity; return rc.intersectObject(mesh, false)[0] || null; };
  ray.fast = !!e.geo.boundsTree;
  ray.dispose = () => mesh.material.dispose();
  return ray;
}

// ¿Hueco o macizo? Mira la pared junto al borde: en un agujero su normal apunta hacia el eje.
function rimSide(an, center, axis, r) {
  const u = (Math.abs(axis.x) < 0.9 ? EX : EY).clone().projectOnPlane(axis).normalize(), w = axis.clone().cross(u);
  let vote = 0;
  for (let k = 0; k < 6; k++) {
    const dir = u.clone().multiplyScalar(Math.cos(k * Math.PI / 3)).addScaledVector(w, Math.sin(k * Math.PI / 3));
    const e = nearestFeatureEdge(an, center.clone().addScaledVector(dir, r), Math.max(r * 0.15, an.diag * 1e-4));
    if (e < 0) continue;
    let best = -1, bestA = 0.9;
    for (const f of [an.EF0[e], an.EF1[e]]) {
      if (f < 0) continue;
      const a = Math.abs(an.FN[3 * f] * axis.x + an.FN[3 * f + 1] * axis.y + an.FN[3 * f + 2] * axis.z);
      if (a < bestA) { bestA = a; best = f; }
    }
    if (best >= 0) vote += Math.sign(an.FN[3 * best] * dir.x + an.FN[3 * best + 1] * dir.y + an.FN[3 * best + 2] * dir.z);
  }
  return vote < 0 ? 'hole' : vote > 0 ? 'boss' : null;
}

function partFeatures(p) {
  const e = pool.get(p.id);
  if (e.feats) return e.feats;
  const an = e.an;
  const circles = [], seen = new Set();
  for (const fe of an.featE) {
    const c = an.loopCache.has(fe) ? an.loopCache.get(fe) : loopFor(an, fe);
    if (c && c.closed && !seen.has(c)) { seen.add(c); circles.push(c); }
  }
  const tol = Math.max(an.diag * 1e-3, 1e-9);
  const groups = [];
  for (const c of circles) {
    const g = groups.find((g) => Math.abs(g.axis.dot(c.normal)) > 0.999 && Math.abs(g.r - c.radius) < Math.max(tol, c.radius * 0.02)
      && c.center.clone().sub(g.c0).projectOnPlane(g.axis).length() < Math.max(tol, c.radius * 0.05));
    if (g) g.rims.push(c); else groups.push({ axis: canonAxis(c.normal), c0: c.center.clone(), r: c.radius, rims: [c] });
  }
  const ray = partRay(p);
  const feats = [];
  for (const g of groups) {
    if (g.rims.length < 2) continue;              // un solo borde: chaflán o escalón
    const ts = g.rims.map((c) => c.center.clone().sub(g.c0).dot(g.axis));
    const t0 = Math.min(...ts), t1 = Math.max(...ts);
    if (t1 - t0 < tol) continue;
    const r = g.rims.reduce((s, c) => s + c.radius, 0) / g.rims.length;
    const bottom = g.c0.clone().addScaledVector(g.axis, t0), top = g.c0.clone().addScaledVector(g.axis, t1);
    const kind = rimSide(an, top, g.axis, r);
    if (!kind) continue;
    let through = false, entry = top;
    if (kind === 'hole') {
      // Rayos dentro del agujero (a 0.7 r del eje, para no colarse por un agujero menor coaxial).
      const side = (Math.abs(g.axis.x) < 0.9 ? EX : EY).clone().projectOnPlane(g.axis).normalize().multiplyScalar(0.7 * r);
      const mid = bottom.clone().lerp(top, 0.5), half = (t1 - t0) / 2;
      const closed = (dir) => [1, -1].every((sg) => { const hit = ray(mid.clone().addScaledVector(side, sg), dir); return !!hit && hit.distance < half + 2 * tol; });
      const up = closed(g.axis), down = closed(g.axis.clone().negate());
      through = !up && !down;
      if (up && !down) entry = bottom;           // ciego desde abajo: la boca es el borde inferior
    }
    feats.push({ kind, through, axis: g.axis, top, bottom, entry, r, depth: t1 - t0 });
  }
  ray.dispose();
  const q = (v) => Math.round(v / tol);
  feats.sort((a, b) => (a.kind === b.kind ? 0 : a.kind === 'hole' ? -1 : 1) || q(b.r) - q(a.r) || q(a.top.x) - q(b.top.x) || q(a.top.y) - q(b.top.y) || q(a.top.z) - q(b.top.z));
  let nh = 0, nb = 0;
  for (const f of feats) f.id = f.kind === 'hole' ? `A${++nh}` : `C${++nb}`;
  e.feats = feats;
  return feats;
}

// ── Vistas ─────────────────────────────────────────────────────────
// Base de cada vista: r = derecha, u = arriba, n = hacia quien mira. Todo en ejes del STL.
const SHEET_FRONTS = {
  y: { r: EX, u: EZ },   // mirando hacia +Y, Z arriba
  z: { r: EX, u: EY },   // mirando hacia −Z: piezas planas o CAD con Y arriba
  x: { r: EY, u: EZ },   // mirando hacia −X
};
function viewBases(front) {
  const r = SHEET_FRONTS[front].r.clone(), u = SHEET_FRONTS[front].u.clone(), n = r.clone().cross(u);
  const iv = n.clone().add(r).add(u).normalize(), ir = u.clone().cross(iv).normalize();
  return {
    front: { r, u, n },
    top: { r: r.clone(), u: n.clone().negate(), n: u.clone() },
    right: { r: n.clone().negate(), u: u.clone(), n: r.clone() },
    left: { r: n.clone(), u: u.clone(), n: r.clone().negate() },
    iso: { r: ir, u: iv.clone().cross(ir), n: iv },
  };
}
// Vista frontal sugerida: la que ve de frente más agujeros; si no hay, la cara más grande.
function autoFront(p) {
  const cnt = { x: 0, y: 0, z: 0 };
  for (const f of partFeatures(p)) { const k = axisName(f.axis).toLowerCase(); if (k in cnt) cnt[k] += f.kind === 'hole' ? 2 : 1; }
  const sz = pool.get(p.id).an.size;
  return ['y', 'z', 'x'].sort((a, b) => cnt[b] - cnt[a] || sz[a] - sz[b])[0];
}

// Aristas vivas + siluetas proyectadas; cada arista se parte donde algo la tapa (rayo hacia quien mira).
function viewGeometry(p, B, withHidden, ray, feats) {
  const an = pool.get(p.id).an;
  const { P, EA, EB, EF0, EF1, FN, FA, isFeat } = an;
  const o = an.bbox.min, n = B.n, r = B.r, u = B.u;
  const X = (x, y, z) => (x - o.x) * r.x + (y - o.y) * r.y + (z - o.z) * r.z;
  const Y = (x, y, z) => (x - o.x) * u.x + (y - o.y) * u.y + (z - o.z) * u.z;
  const dn = (f) => FN[3 * f] * n.x + FN[3 * f + 1] * n.y + FN[3 * f + 2] * n.z;
  const vis = [], hid = [];
  const eps = an.diag * 2e-5, step = an.diag / 90, Q = V3();
  for (let e = 0, nE = EA.length; e < nE; e++) {
    if (!isFeat[e]) {
      const f0 = EF0[e], f1 = EF1[e];
      if (f1 < 0 || !(FA[f0] > 0) || !(FA[f1] > 0) || (dn(f0) > 1e-6) === (dn(f1) > 1e-6)) continue;
    }
    const a = 3 * EA[e], b = 3 * EB[e];
    const x1 = X(P[a], P[a + 1], P[a + 2]), y1 = Y(P[a], P[a + 1], P[a + 2]);
    const x2 = X(P[b], P[b + 1], P[b + 2]), y2 = Y(P[b], P[b + 1], P[b + 2]);
    const len = Math.hypot(x2 - x1, y2 - y1);
    if (len < an.diag * 1e-7) continue;
    if (!ray) { vis.push(x1, y1, x2, y2); continue; }
    const k = Math.min(24, Math.ceil(len / step));
    const flush = (i0, i1, v) => { if (v || withHidden) (v ? vis : hid).push(x1 + (x2 - x1) * i0 / k, y1 + (y2 - y1) * i0 / k, x1 + (x2 - x1) * i1 / k, y1 + (y2 - y1) * i1 / k); };
    let start = 0, cur = true;
    for (let i = 0; i < k; i++) {
      const t = (i + 0.5) / k;
      Q.set(P[a] + (P[b] - P[a]) * t, P[a + 1] + (P[b + 1] - P[a + 1]) * t, P[a + 2] + (P[b + 2] - P[a + 2]) * t).addScaledVector(n, eps);
      const v = !ray(Q, n, eps);
      if (i === 0) cur = v;
      else if (v !== cur) { flush(start, i, cur); start = i; cur = v; }
    }
    flush(start, k, cur);
  }
  // Sin repetidos (en un perfil extruido la cara de atrás cae justo sobre la de enfrente).
  const qq = an.diag * 1e-5;
  const keyOf = (s, i) => {

function snapshot() {

      fusedTo: p.fusedTo || null, fuseMate: p.fuseMate ? { Lc: p.fuseMate.Lc.toArray(), Lp: p.fuseMate.Lp.toArray(), flip: p.fuseMate.flip, angle: p.fuseMate.angle, offset: p.fuseMate.offset } : null })),

      id: j.id, name: j.name, parent: j.parent, child: j.child, type: j.type, axis: j.axis, sign: j.sign,
      framePos: j.framePos.toArray(), holeQuat: j.holeQuat.toArray(), worldQuat: j.worldQuat.toArray(), spin: j.spin, frameMode: j.frameMode,
      rot: { ...j.rot }, lin: { ...j.lin }, q: j.q, home: j.home,
      mate: j.mate ? { Lc: j.mate.Lc.toArray(), Lp: j.mate.Lp.toArray(), flip: j.mate.flip, angle: j.mate.angle, offset: j.mate.offset } : null,
    })),
  };
}
function restore(s) {
  stopPlayQuiet();
  const parts = new Map();
  for (const sp of s.parts) {
    if (!pool.has(sp.id)) continue;
    let p = S.parts.get(sp.id);
    if (!p) p = newPartObject(sp.id, {});
    Object.assign(p, { name: sp.name, fileName: sp.fileName, unit: sp.unit, color: sp.color, mat: MATERIALS[sp.mat] ? sp.mat : 'pla', density: sp.density ?? 1000, infill: sp.infill ?? 20, walls: sp.walls ?? 1.2, massOverride: sp.massOverride ?? null });
    p.fusedTo = sp.fusedTo || null;
    p.fuseMate = sp.fuseMate ? { Lc: M4().fromArray(sp.fuseMate.Lc), Lp: M4().fromArray(sp.fuseMate.Lp), flip: sp.fuseMate.flip, angle: sp.fuseMate.angle, offset: sp.fuseMate.offset } : null;
    p.rest = M4().fromArray(sp.rest);
    if (!p.mesh) makePartMesh(p);
    parts.set(p.id, p);
  }
  for (const [id, p] of S.parts) if (!parts.has(id)) removePartMesh(p);
  S.parts = parts;
  for (const j of S.joints.values()) removeJointVis(j);
  S.joints = new Map();
  for (const sj of s.joints) {
    if (!parts.has(sj.parent) || !parts.has(sj.child)) continue;
    const j = newJoint({
      id: sj.id, name: sj.name, parent: sj.parent, child: sj.child, type: sj.type, axis: sj.axis, sign: sj.sign,
      framePos: V3().fromArray(sj.framePos), holeQuat: new THREE.Quaternion().fromArray(sj.holeQuat), worldQuat: new THREE.Quaternion().fromArray(sj.worldQuat),
      spin: sj.spin || 0, frameMode: sj.frameMode, rot: { ...sj.rot }, lin: { ...sj.lin }, q: sj.q || 0, home: sj.home || 0,
      mate: sj.mate ? { Lc: M4().fromArray(sj.mate.Lc), Lp: M4().fromArray(sj.mate.Lp), flip: sj.mate.flip, angle: sj.mate.angle, offset: sj.mate.offset } : null,
    });
    S.joints.set(j.id, j);
  }
  S.robotName = s.robotName || 'mi_robot';
  S.baseId = s.baseId;
  S.isExample = !!s.isExample;
  S.colorIdx = s.colorIdx || 0;
  const ids = [...parts.keys(), ...S.joints.keys()].map((x) => parseInt(String(x).slice(1), 10) || 0);
  S.seq = Math.max(s.seq || 1, ...ids, 0) + 1;
  rebuildIndex();
  for (const j of S.joints.values()) buildJointVis(j);
  if (S.sel && !(S.sel.type === 'part' ? S.parts.has(S.sel.id) : S.joints.has(S.sel.id))) S.sel = null;
  renderUI();
}
function stopPlayQuiet() { S.play = null; S.preview = null; }

const hist = { stack: [], idx: -1 };
function commit() {
  const s = JSON.stringify(snapshot());
  if (hist.stack[hist.idx] === s) return;
  hist.stack.splice(hist.idx + 1);
  hist.stack.push(s);
  if (hist.stack.length > 80) hist.stack.shift();
  hist.idx = hist.stack.length - 1;
  updateUndoButtons();
  scheduleSave();
}
function undo() {
  if (hist.idx <= 0) return;
  if (S.jt) endJointTool();
  hist.idx--; restore(JSON.parse(hist.stack[hist.idx])); scheduleSave();
}
function redo() {
  if (hist.idx >= hist.stack.length - 1) return;
  if (S.jt) endJointTool();
  hist.idx++; restore(JSON.parse(hist.stack[hist.idx])); scheduleSave();
}
function updateUndoButtons() {
  $('#btnUndo').disabled = hist.idx <= 0;
  $('#btnRedo').disabled = hist.idx >= hist.stack.length - 1;
}

// ── Borrador automático en este navegador (IndexedDB) ──────────────
const idb = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open('eslabon-urdf', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async op(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('kv', mode);
      const req = fn(tx.objectStore('kv'));
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  },
  get(k) { return this.op('readonly', (s) => s.get(k)); },
  set(k, v) { return this.op('readwrite', (s) => s.put(v, k)); },
  del(k) { return this.op('readwrite', (s) => s.delete(k)); },
  keys() { return this.op('readonly', (s) => s.getAllKeys()); },
};
let saveTimer = null;
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveDraft, 1200); }
async function saveDraft() {
  try {
    await idb.set('state', JSON.stringify(snapshot()));
    for (const p of S.parts.values()) {
      const e = pool.get(p.id);
      if (!e.saved) { await idb.set(`stl:${p.id}`, e.stl); e.saved = true; }
    }
    const keys = await idb.keys();
    for (const k of keys) {
      if (typeof k === 'string' && k.startsWith('stl:') && !S.parts.has(k.slice(4))) {
        await idb.del(k);
        const e = pool.get(k.slice(4)); if (e) e.saved = false;
      }
    }
  } catch (e) { /* almacenamiento no disponible: se ignora */ }
}
async function restoreDraft() {
  try {
    const raw = await Promise.race([idb.get('state'), new Promise((r) => setTimeout(() => r(null), 2500))]);
    if (!raw) return false;
    const snap = JSON.parse(raw);
    if (!snap.parts || !snap.parts.length) return false;
    for (const sp of snap.parts) {
      const buf = await idb.get(`stl:${sp.id}`);
      if (!buf) return false;
      poolAdd(sp.id, buf, sp.fileName);
      pool.get(sp.id).saved = true;
      await tick();
    }
    restore(snap);
    return true;
  } catch (e) { return false; }
}

// ── Proyecto (.json) ───────────────────────────────────────────────
function bufToB64(buf) {
  const u8 = new Uint8Array(buf); let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64ToBuf(b64) {
  const s = atob(b64); const u8 = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
  return u8.buffer;
}
async function saveProject() {
  if (!S.parts.size) { toast('No hay nada que guardar todavía.', 'warn'); return; }
  const snap = snapshot();
  snap.stl = {};
  for (const p of S.parts.values()) snap.stl[p.id] = bufToB64(pool.get(p.id).stl);
  await saveFile(`${rosName(S.robotName, 'robot')}.eslabon.json`, JSON.stringify(snap));
}
async function openProject(file) {
  try {
    const snap = JSON.parse(await file.text());
    if (snap.app !== 'eslabon-urdf' || !snap.stl) throw new Error('formato');
    for (const sp of snap.parts) { if (!snap.stl[sp.id]) throw new Error('stl'); poolAdd(sp.id, b64ToBuf(snap.stl[sp.id]), sp.fileName); await tick(); }
    delete snap.stl;
    S.sel = null;
    restore(snap);
    commit(); fitView(VIEWS.iso);
    toast(`Abrí ${S.robotName}: ${S.parts.size} piezas, ${S.joints.size} uniones.`);
  } catch (e) {
    toast('Ese archivo no es un proyecto de Eslabón válido.', 'err');
  }
}

// ── Subir STL ──────────────────────────────────────────────────────
function clearAll() {
  if (S.jt) endJointTool();
  stopPlayQuiet();
  for (const j of S.joints.values()) removeJointVis(j);
  for (const p of S.parts.values()) removePartMesh(p);
  S.joints = new Map(); S.parts = new Map(); S.baseId = null; S.sel = null; S.isExample = false; S.colorIdx = 0;
  rebuildIndex();
}
async function addFiles(fileList) {
  const files = [...fileList];
  const proj = files.find((f) => /\.json$/i.test(f.name));
  if (proj) { await openProject(proj); return; }
  const stl = files.filter((f) => /\.stl$/i.test(f.name));
  if (!stl.length) { toast('Solo acepto archivos .stl (o un proyecto .json de Eslabón).', 'warn'); return; }
  if (S.isExample) {
    clearAll();
    S.robotName = 'mi_robot';
    commit();
    toast('Quité el robot de ejemplo para empezar con tus piezas.');
  }
  const hadBase = !!S.baseId;
  setStatus(`Analizando ${stl.length} ${stl.length === 1 ? 'pieza' : 'piezas'}…`);
  await tick();
  const added = [];
  for (const f of stl) {
    try { const buf = await f.arrayBuffer(); added.push(await addPartFromSTL(buf, f.name, S.newUnit)); }
    catch (e) { logError(`STL ${f.name}: ${e && e.message}`); toast(`No pude leer ${f.name}. ¿Es un STL válido?`, 'err', 8000, { label: 'Reportar', fn: () => openReport('bug') }); }
    await tick();
  }
  if (!added.length) { setIdleStatus(); return; }
  rebuildIndex();
  const arranged = maybeArrange(added);
  if (!hadBase) { S.baseId = null; rebuildIndex(); }
  const firstTime = S.parts.size === added.length;
  WORLD = computeWorld(true);
  const box = sceneBox();
  const big = box.getSize(V3()).length();
  if (big > 20 && S.newUnit !== 0.001) toast('Las piezas se ven muy grandes. ¿El archivo estaba en milímetros? Cambia la unidad en el inspector.', 'warn', 7000);
  else if (big < 0.004) toast('Las piezas se ven diminutas. Prueba con otra unidad (cm o m).', 'warn', 7000);
  fitView(firstTime ? VIEWS.iso : null);
  commit();
  renderUI();
  toast(`${added.length === 1 ? `Agregué ${added[0].name}` : `Agregué ${added.length} piezas`}.${arranged ? ' Estaban encimadas, así que las acomodé en fila.' : ''}${S.parts.size > 1 ? ' Presiona J para unirlas.' : ''}`, 'info', 5500);
}

// ── Robot de ejemplo (generado aquí mismo y convertido a STL) ──────
function exampleParts() {
  const ext = (shape, depth, seg = 40) => new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: seg });
  const hole = (x, y, r) => { const p = new THREE.Path(); p.absarc(x, y, r, 0, Math.PI * 2, true); return p; };
  const toXZ = (g, y0) => { g.rotateX(Math.PI / 2); g.translate(0, y0, 0); return g; }; // perfil XY → plano XZ, extruido en +Y desde y0 - depth
  const out = [];
  // base: disco de aluminio con agujero central y 4 de montaje
  const base = new THREE.Shape(); base.absarc(0, 0, 60, 0, Math.PI * 2, false);
  base.holes.push(hole(0, 0, 8));
  for (let k = 0; k < 4; k++) base.holes.push(hole(45 * Math.cos(Math.PI / 4 + k * Math.PI / 2), 45 * Math.sin(Math.PI / 4 + k * Math.PI / 2), 3));
  out.push({ name: 'base_link', file: 'base.stl', mat: 'al', color: MATERIALS.al.color, geo: ext(base, 16, 48) });
  // torreta: pie + torre con agujero del hombro
  const tor = new THREE.Shape();
  tor.moveTo(-35, 0); tor.lineTo(35, 0); tor.lineTo(35, 10); tor.lineTo(14, 10); tor.lineTo(14, 60);
  tor.absarc(0, 60, 14, 0, Math.PI, false); tor.lineTo(-14, 10); tor.lineTo(-35, 10); tor.lineTo(-35, 0);
  tor.holes.push(hole(0, 60, 5));
  const torG = toXZ(ext(tor, 28), 14); torG.translate(0, 0, 16);
  out.push({ name: 'torreta', file: 'torreta.stl', mat: 'pla', color: '#3D7DCA', geo: torG });
  // brazo: eslabón vertical
  const slot = (len, w, rh) => {
    const s = new THREE.Shape();
    s.moveTo(w, 0); s.lineTo(w, len); s.absarc(0, len, w, 0, Math.PI, false); s.lineTo(-w, 0); s.absarc(0, 0, w, Math.PI, Math.PI * 2, false);
    s.holes.push(hole(0, 0, rh), hole(0, len, rh));
    return s;
  };
  const brazoG = toXZ(ext(slot(110, 12, 5), 8), 22); brazoG.translate(0, 0, 76);
  out.push({ name: 'brazo', file: 'brazo.stl', mat: 'pla', color: '#E9E7E1', geo: brazoG });
  // antebrazo: eslabón horizontal
  const ante = new THREE.Shape();
  ante.moveTo(0, -10); ante.lineTo(95, -10); ante.absarc(95, 0, 10, -Math.PI / 2, Math.PI / 2, false); ante.lineTo(0, 10); ante.absarc(0, 0, 10, Math.PI / 2, Math.PI * 1.5, false);
  ante.holes.push(hole(0, 0, 4.5), hole(95, 0, 4.5));
  const anteG = toXZ(ext(ante, 8), 30); anteG.translate(0, 0, 186);
  out.push({ name: 'antebrazo', file: 'antebrazo.stl', mat: 'pla', color: '#3D7DCA', geo: anteG });
  // pinza: horquilla
  const pz = new THREE.Shape();
  pz.moveTo(0, -10); pz.lineTo(28, -10); pz.lineTo(28, -16); pz.lineTo(62, -16); pz.lineTo(62, -7); pz.lineTo(38, -7); pz.lineTo(38, 7); pz.lineTo(62, 7);
  pz.lineTo(62, 16); pz.lineTo(28, 16); pz.lineTo(28, 10); pz.lineTo(0, 10); pz.absarc(0, 0, 10, Math.PI / 2, Math.PI * 1.5, false);
  pz.holes.push(hole(0, 0, 4.5));
  const pzG = toXZ(ext(pz, 8), 38); pzG.translate(95, 0, 186);
  out.push({ name: 'pinza', file: 'pinza.stl', mat: 'petg', color: '#2A9D8F', geo: pzG });
  // servos (componentes fijos que se fusionan a su pieza)
  const servo = (z0, y0, name, host) => {
    const s = new THREE.Shape();
    s.moveTo(-10, z0); s.lineTo(10, z0); s.lineTo(10, z0 + 40); s.lineTo(-10, z0 + 40); s.lineTo(-10, z0);
    out.push({ name, file: `${name}.stl`, mat: 'abs', color: '#2E4FA3', geo: toXZ(ext(s, 22), y0), host, mass: 0.055 });
  };
  servo(66, -14, 'servo_hombro', 'torreta');
  servo(176, 14, 'servo_codo', 'brazo');
  return out;
}
async function loadExample() {
  clearAll();
  const defs = exampleParts();
  const ids = {};
  for (const d of defs) {
    const p = await addPartFromSTL(geometryToBinarySTL(d.geo), d.file, 0.001, { name: d.name, mat: d.mat, color: d.color });
    ids[d.name] = p.id;
    if (d.mass) p.massOverride = d.mass;
  }
  const mk = (name, parent, child, pos, holeAxis, axis, lo, hi, act, home) => {
    const j = newJoint({ name, parent: ids[parent], child: ids[child] });
    j.framePos.copy(pos.clone().multiplyScalar(0.001));
    j.holeQuat.copy(decompose(frameFromZ(V3(), holeAxis)).q);
    j.frameMode = 'world'; j.worldQuat = new THREE.Quaternion(); j.axis = axis; j.sign = 1;
    const a = ACT_ROT.find((x) => x.id === act);
    j.rot = { lo: lo * DEG, hi: hi * DEG, effort: a.e, vel: a.v, act };
    j.home = home * DEG; j.q = j.home;
    S.joints.set(j.id, j);
  };
  mk('giro_base', 'base_link', 'torreta', V3(0, 0, 16), EZ, 'z', -170, 170, 'ds3218', 0);
  mk('hombro', 'torreta', 'brazo', V3(0, 14, 76), EY, 'y', -90, 90, 'ds3218', 15);
  mk('codo', 'brazo', 'antebrazo', V3(0, 22, 186), EY, 'y', -135, 135, 'mg996r', -40);
  mk('muneca', 'antebrazo', 'pinza', V3(95, 30, 186), EY, 'y', -90, 90, 'sg90', 25);
  for (const d of defs) if (d.host) S.parts.get(ids[d.name]).fusedTo = ids[d.host];
  S.robotName = 'brazo_ejemplo';
  S.baseId = ids.base_link;
  S.isExample = true;
  S.sel = null;
  rebuildIndex();
  for (const j of S.joints.values()) buildJointVis(j);
  renderUI();
  fitView(VIEWS.iso);
}

// ── Conexión de la interfaz ────────────────────────────────────────
function wireUI() {
  $('#btnUndo').innerHTML = svgIcon('undo');
  $('#btnRedo').innerHTML = svgIcon('redo');
  $('#btnUndo').onclick = undo;
  $('#btnRedo').onclick = redo;
  $('#btnUpload').append(iconEl('upload'), 'Subir STL');
  $('#btnUpload').onclick = () => $('#fileInput').click();
  $('#fileInput').onchange = (ev) => { addFiles(ev.target.files); ev.target.value = ''; };
  $('#projInput').onchange = (ev) => { if (ev.target.files[0]) openProject(ev.target.files[0]); ev.target.value = ''; };
  $('#btnOpen').prepend(iconEl('upload')); $('#btnOpen').onclick = () => $('#projInput').click();
  $('#btnSave').prepend(iconEl('download')); $('#btnSave').onclick = saveProject;
  $('#btnNew').onclick = () => {
    if (!S.parts.size) return;
    clearAll(); S.robotName = 'mi_robot'; commit(); renderUI(); fitView(VIEWS.iso);
    toast('Proyecto vacío. Ctrl+Z lo regresa.');
  };
  $('#btnExample').onclick = async () => { await loadExample(); commit(); toast('Cargué el brazo de ejemplo.'); };
  $('#btnGenerate').onclick = openExport;
  $('#btnReport').prepend(iconEl('bug'));
  $('#btnReport').onclick = () => openReport();
  $('#reportModal').addEventListener('click', (ev) => { if (ev.target.id === 'reportModal') closeReport(); });
  $('#robotName').addEventListener('change', (ev) => { S.robotName = rosName(ev.target.value, 'robot'); ev.target.value = S.robotName; commit(); renderInspector(); });
  $('#btnPoseZero').onclick = () => { stopPlay(); for (const j of S.joints.values()) j.q = 0; needsRender = true; liveJointValues(true); commit(); };
  $('#btnPoseHome').onclick = () => { stopPlay(); for (const j of S.joints.values()) j.q = j.home; needsRender = true; liveJointValues(true); commit(); };
  $('#btnPoseSaveHome').onclick = () => { stopPlay(); for (const j of S.joints.values()) j.home = j.q; commit(); renderInspector(); toast('Guardé la pose actual como home de todas las articulaciones.'); };
  renderViews();

  // Arrastrar y soltar
  let dragDepth = 0;
  const overlay = $('#dropOverlay');
  const hasFiles = (ev) => ev.dataTransfer && [...(ev.dataTransfer.types || [])].includes('Files');
  window.addEventListener('dragenter', (ev) => { if (!hasFiles(ev)) return; ev.preventDefault(); dragDepth++; overlay.hidden = false; });
  window.addEventListener('dragover', (ev) => { if (!hasFiles(ev)) return; ev.preventDefault(); });
  window.addEventListener('dragleave', (ev) => { if (!hasFiles(ev)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) overlay.hidden = true; });
  window.addEventListener('drop', (ev) => { if (!hasFiles(ev)) return; ev.preventDefault(); dragDepth = 0; overlay.hidden = true; addFiles(ev.dataTransfer.files); });

  // Teclado
  window.addEventListener('keydown', (ev) => {
    const tag = (ev.target.tagName || '').toLowerCase();
    if (['input', 'select', 'textarea'].includes(tag)) return;
    const k = ev.key.toLowerCase();
    if ((ev.ctrlKey || ev.metaKey) && k === 'z') { ev.preventDefault(); if (ev.shiftKey) redo(); else undo(); return; }
    if ((ev.ctrlKey || ev.metaKey) && k === 'y') { ev.preventDefault(); redo(); return; }
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (!$('#reportModal').hidden) { if (k === 'escape') closeReport(); return; }
    if (!$('#exportModal').hidden) { if (k === 'escape') closeExport(); return; }
    if (!$('#sheetModal').hidden) { if (k === 'escape') closeSheet(); return; }
    if (k === 'escape') { if (S.jt) endJointTool(); else if (S.play) stopPlay(); else select(null); }
    else if (k === 'v') setTool('select');
    else if (k === 'g') setTool('move');
    else if (k === 'r') setTool('rotate');
    else if (k === 'j') setTool('joint');
    else if (k === 'u') setTool('fuse');
    else if (k === 'f') fitView();
    else if (k === 'delete' || k === 'backspace') { ev.preventDefault(); deleteSelected(); }
  });
  $('#exportModal').addEventListener('click', (ev) => { if (ev.target.id === 'exportModal') closeExport(); });
  $('#sheetModal').addEventListener('click', (ev) => { if (ev.target.id === 'sheetModal') closeSheet(); });

  // Tema claro/oscuro: recolorea la escena 3D
  const retheme = () => {
    applyGridColors(); buildGizmo(); buildGrid(gridSize || 1);
    for (const j of S.joints.values()) buildJointVis(j);
    for (const g of [snapG, pickG]) g.traverse((o) => { if (o.material) o.material.color.set(cssVar('--accent-fill')); });
    styleAll(); needsRender = true;
  };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}

// ── Inicio ─────────────────────────────────────────────────────────
async function boot() {
  wireUI();
  resize();
  renderUI();
  requestAnimationFrame(frameLoop);
  window.__eslabonReady = true;
  const restored = await restoreDraft();
  if (restored) {
    fitView(VIEWS.iso);
    if (!S.isExample) toast('Recuperé tu proyecto anterior de este navegador.');
  } else {
    await loadExample();
  }
  commit();
  setIdleStatus();
}
boot();

</script>
